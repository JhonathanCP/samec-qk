# ══════════════════════════════════════════════════════════════════════════════════════════
#  SAMEC — core (Quarkus)
#  Perfiles: dev (mvn quarkus:dev), test (mvn test) y prod (jar / Docker).
#  Todo lo sensible (BD, claves, correo) entra por variables de entorno: nada de credenciales
#  reales en este archivo.
# ══════════════════════════════════════════════════════════════════════════════════════════

quarkus.application.name=samec-core
quarkus.http.port=8753
quarkus.http.host=0.0.0.0

# Tope del cuerpo de una petición (Nginx acepta hasta 15 MB y corta antes).
# Evidencias: hasta 10 archivos de 20 MB por petición (ver EvidenceService / StoredFile).
quarkus.http.limits.max-body-size=100M
# Frena conexiones lentas que retienen recursos (tipo slowloris); mismo criterio que Auditorías.
quarkus.http.idle-timeout=30s
quarkus.http.read-timeout=60s

# ── Base de datos ─────────────────────────────────────────────────────────────────────────
# OJO: db-kind se fija al COMPILAR (Quarkus genera el dialecto en build). Dev usa PostgreSQL;
# la imagen Docker se compila con SAMEC_DB_KIND (oracle por defecto, ver docker-compose.yml).
quarkus.datasource.db-kind=${SAMEC_DB_KIND:postgresql}
quarkus.datasource.jdbc.url=${SAMEC_DB_URL:jdbc:postgresql://localhost:5432/samec}
quarkus.datasource.username=${SAMEC_DB_USER:postgres}
quarkus.datasource.password=${SAMEC_DB_PASSWORD:root}
quarkus.datasource.jdbc.max-size=20
# Si el pool se agota, la petición falla en 10 s en vez de acumular hilos esperando.
quarkus.datasource.jdbc.acquisition-timeout=10s

# Sin contenedores automáticos (Dev Services): dev usa el PostgreSQL local y el Kafka de
# docker-compose; los tests usan H2 y un canal en memoria. Así no hace falta Docker para trabajar.
# (Las claves JWT de dev/test no dependen de esto: se siguen generando en memoria.)
quarkus.devservices.enabled=false

# Hibernate crea/actualiza tablas y columnas nuevas al arrancar (mismo criterio que Auditorías).
# No borra nada; los cambios que "update" no puede hacer sobre tablas con filas se aplican a mano.
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
# Con "update" en PostgreSQL, Hibernate avisa "constraint ... does not exist, skipping" en cada arranque.
quarkus.log.category."org.hibernate.orm.jdbc.warn".level=ERROR
quarkus.hibernate-orm.jdbc.timezone=America/Lima

# ── JWT ───────────────────────────────────────────────────────────────────────────────────
# Access token firmado con RS256 (30 min). En dev/test Quarkus genera un par de claves en
# memoria; en producción se montan los PEM (ver scripts/generar-claves-jwt.sh).
mp.jwt.verify.issuer=samec
smallrye.jwt.new-token.issuer=samec
%prod.mp.jwt.verify.publickey.location=${SAMEC_JWT_PUBLIC_KEY:/run/secrets/jwt/publicKey.pem}
%prod.smallrye.jwt.sign.key.location=${SAMEC_JWT_PRIVATE_KEY:/run/secrets/jwt/privateKey.pem}

# ── Seguridad ─────────────────────────────────────────────────────────────────────────────
# Seguro por defecto: todo endpoint sin anotación exige sesión (cualquier rol). Los públicos
# se marcan con @PermitAll y las acciones con @PermissionsAllowed (ver security/Permisos).
quarkus.security.jaxrs.default-roles-allowed=**

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${SAMEC_CORS_ORIGINS:http://localhost:4200,http://localhost:8754}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=1H

# ── Kafka: eventos de correo hacia email-service ──────────────────────────────────────────
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9097}
mp.messaging.outgoing.correos.connector=smallrye-kafka
mp.messaging.outgoing.correos.topic=${SAMEC_EMAIL_TOPIC:samec-email-topic}
mp.messaging.outgoing.correos.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Si Kafka no confirma en 30 s, el envío se da por fallido y queda en el log (no bloquea a nadie).
# Kafka exige delivery.timeout.ms >= linger.ms + request.timeout.ms.
mp.messaging.outgoing.correos.request.timeout.ms=15000
mp.messaging.outgoing.correos.delivery.timeout.ms=30000
# Si Kafka está caído, reintenta la conexión con espera creciente (hasta 30 s) en vez de cada segundo.
mp.messaging.outgoing.correos.reconnect.backoff.max.ms=30000

# ── OpenAPI / Swagger (solo dev: http://localhost:8753/q/swagger-ui) ─────────────────────
quarkus.smallrye-openapi.info-title=SAMEC API
quarkus.smallrye-openapi.info-version=0.1.0

# ── Propios de SAMEC (ver SamecConfig) ───────────────────────────────────────────────────
# URL pública del frontend: se usa en los enlaces de los correos.
samec.app-url=${SAMEC_APP_URL:http://localhost:4200}
# true en cuanto el despliegue tenga TLS (con HTTP puro el navegador descarta cookies Secure).
samec.cookie.secure=${SAMEC_COOKIE_SECURE:false}
samec.recaptcha.enabled=${SAMEC_RECAPTCHA_ENABLED:false}
samec.recaptcha.secret=${SAMEC_RECAPTCHA_SECRET:}
samec.auth.access-token-minutos=30
samec.auth.refresh-token-horas=24
samec.auth.refresh-gracia-segundos=30
samec.auth.otp-minutos=5
samec.auth.password-longitud-minima=8
# Solo se acepta X-Real-IP de estos proxies (Nginx en la red de docker-compose y localhost).
samec.ratelimit.enabled=true
samec.ratelimit.proxies-confiables=${SAMEC_PROXIES_CONFIABLES:127.0.0.1,::1,192.168.220.0/24}
samec.registro.dominio-correo=essalud.gob.pe

# Usuarios de prueba (uno por rol, ver README): solo en dev/test, nunca en producción.
# Catálogo LEA (seed/lea.json) y tipos de observación: se cargan al arrancar si el catálogo está
# vacío. En test se apaga: cada prueba arma su propio catálogo (LeaCatalogSeedTest carga el real).
samec.seed.lea=true
%test.samec.seed.lea=false
samec.seed.usuarios-demo=false
%dev.samec.seed.usuarios-demo=true
%test.samec.seed.usuarios-demo=true
# Primer administrador en producción: se crea solo si no existe ningún ADMIN_SISTEMA.
samec.seed.admin-inicial.username=${SAMEC_ADMIN_USERNAME:}
samec.seed.admin-inicial.email=${SAMEC_ADMIN_EMAIL:}
samec.seed.admin-inicial.password=${SAMEC_ADMIN_PASSWORD:}

# ── Test: H2 en memoria y correos a un canal en memoria (sin Docker ni Kafka) ─────────────
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:samec;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.mp.messaging.outgoing.correos.connector=smallrye-in-memory
%test.samec.ratelimit.enabled=false
# Sin gracia, para probar la detección de reuso de refresh tokens sin esperar.
%test.samec.auth.refresh-gracia-segundos=0
