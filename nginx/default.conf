# ══════════════════════════════════════════════════════════════════════════════════════════
#  SAMEC — Nginx orquestador: sirve el frontend Angular y reenvía /samec-api/ al core.
#  Se monta en el contenedor nginx-samec (ver docker-compose.yml).
# ══════════════════════════════════════════════════════════════════════════════════════════

# ── Límites de solicitudes por IP ─────────────────────────────────────────────────────────
# Este archivo se incluye dentro del bloque http de Nginx, por eso las zonas van aquí.
# Valores amplios a propósito: varios usuarios de un hospital pueden salir por la misma IP.
# La protección fina (bloqueo por cuenta tras 5 claves incorrectas, límite por usuario, OTP) está
# en el core (security/ratelimit), que además cubre el acceso directo al puerto 8753.
limit_req_zone  $binary_remote_addr zone=api_ip:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=auth_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

upstream samec_core {
    server samec-core:8753;
    keepalive 16;
}

server {
    listen 80;
    server_tokens off;

    # Igual que quarkus.http.limits.max-body-size: las evidencias suben varios archivos por petición.
    client_max_body_size 100m;

    # ── Timeouts del cliente (frenan conexiones lentas, tipo slowloris) ──
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          60s;
    keepalive_timeout     30s;

    # ── Timeouts hacia el core ──
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_http_version    1.1;
    proxy_set_header Connection "";

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # X-Real-IP lo usa el core para el límite por IP (solo lo acepta de esta red, ver
    # samec.ratelimit.proxies-confiables). Se sobrescribe siempre: el cliente no puede falsificarlo.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Cabeceras de seguridad para el frontend ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Respuestas en JSON ({ "message": ... }), que el frontend muestra tal cual. Solo aplican a
    # errores generados por Nginx: los 429 del core pasan con su propio mensaje.
    charset utf-8;
    charset_types application/json;
    error_page 429 = @demasiadas_solicitudes;
    error_page 502 503 504 = @core_no_responde;

    location @demasiadas_solicitudes {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"message":"Demasiadas solicitudes seguidas. Espere unos segundos e intente nuevamente."}';
    }

    location @core_no_responde {
        default_type application/json;
        return 504 '{"message":"El servidor tardó demasiado en responder o no está disponible. Intente nuevamente en unos minutos."}';
    }

    # Endpoints internos de Quarkus (health detallado, métricas, OpenAPI): no se publican.
    location ^~ /samec-api/q/ {
        return 404;
    }

    # Inicio de sesión, recuperación de contraseña y autorregistro: blanco típico de fuerza bruta.
    location ~ ^/samec-api/(auth/login|auth/olvide-password|auth/restablecer-password|usuarios/autorregistro)$ {
        limit_req  zone=auth_ip burst=20 nodelay;
        limit_conn conn_ip 20;
        rewrite ^/samec-api/(.*)$ /$1 break;
        proxy_pass http://samec_core;
    }

    # Resto de la API
    location /samec-api/ {
        limit_req  zone=api_ip burst=100 nodelay;
        limit_conn conn_ip 50;
        proxy_pass http://samec_core/;
    }

    # ── Frontend Angular ──
    # OJO: un add_header dentro de una location anula los del server, por eso se repiten aquí.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # index.html nunca se cachea: así cada despliegue llega de inmediato.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;

        # Anidada a propósito: así no intercepta archivos bajo /samec-api/.
        location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
    }
}
