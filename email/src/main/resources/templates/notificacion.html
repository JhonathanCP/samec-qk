<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Notificación de SAMEC</title>
</head>
<!--
  Plantilla genérica para los avisos del core (usarla antes de crear una plantilla nueva).
  Variables: titulo, mensaje, nombre (opcional), detalle (opcional: mapa etiqueta → valor),
             textoBoton + ruta (opcionales: botón a appUrl + ruta), appUrl.
-->
<body style="background:#F4F6F8;margin:0;padding:0;">
    <table align="center" width="100%" cellpadding="0" cellspacing="0" style="max-width:500px;background:#fff;border-radius:8px;box-shadow:0 2px 8px #00579e22;margin-top:40px;">
        <tr>
            <td style="background:#00579e;padding:24px 0;text-align:center;border-radius:8px 8px 0 0;">
                <img src="cid:logo_essalud_white.png" alt="EsSalud" width="120" style="margin-bottom:8px;">
            </td>
        </tr>
        <tr>
            <td style="padding:32px 24px 24px 24px;">
                <h2 style="color:#00579e;margin-top:0;" th:text="${titulo}">Título</h2>
                <p th:if="${nombre != null}" style="color:#333;font-size:16px;">
                    Hola <b th:text="${nombre}">Nombre</b>,
                </p>
                <p style="color:#333;font-size:15px;white-space:pre-line;" th:text="${mensaje}">Mensaje.</p>
                <table th:if="${detalle != null and !detalle.isEmpty()}" cellpadding="0" cellspacing="0"
                       style="width:100%;font-size:14px;color:#333;background:#f8fafc;border-radius:6px;margin:16px 0;">
                    <tr th:each="fila : ${detalle}">
                        <td style="padding:8px 16px;font-weight:600;width:40%;" th:text="${fila.key}">Etiqueta</td>
                        <td style="padding:8px 16px;" th:text="${fila.value}">Valor</td>
                    </tr>
                </table>
                <p th:if="${textoBoton != null and ruta != null}" style="text-align:center;margin:28px 0;">
                    <a th:href="${appUrl} + ${ruta}" th:text="${textoBoton}"
                       style="background:#00579e;color:#fff;text-decoration:none;padding:12px 28px;border-radius:6px;font-size:15px;display:inline-block;">
                        Ir a SAMEC
                    </a>
                </p>
                <p style="color:#888;font-size:13px;margin-top:32px;">Este correo fue generado automáticamente por SAMEC. No respondas a este mensaje.</p>
            </td>
        </tr>
    </table>
</body>
</html>
