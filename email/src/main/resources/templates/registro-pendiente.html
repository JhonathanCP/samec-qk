<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva solicitud de registro</title>
</head>
<body style="background:#F4F6F8;margin:0;padding:0;">
    <table align="center" width="100%" cellpadding="0" cellspacing="0" style="max-width:500px;background:#fff;border-radius:8px;box-shadow:0 2px 8px #00579e22;margin-top:40px;">
        <tr>
            <td style="background:#00579e;padding:24px 0;text-align:center;border-radius:8px 8px 0 0;">
                <img src="cid:logo_essalud_white.png" alt="EsSalud" width="120" style="margin-bottom:8px;">
            </td>
        </tr>
        <tr>
            <td style="padding:32px 24px 24px 24px;">
                <h2 style="color:#00579e;margin-top:0;">Nueva solicitud de registro</h2>
                <p style="color:#333;font-size:16px;">
                    <b th:text="${nombreSolicitante}">Nombre Apellido</b>
                    (<span th:text="${emailSolicitante}">correo@essalud.gob.pe</span>) solicitó una cuenta como
                    <b th:text="${rolLabel}">Evaluador interno</b> y quedó pendiente de tu aprobación.
                </p>
                <table cellpadding="0" cellspacing="0" style="width:100%;font-size:14px;color:#333;background:#f8fafc;border-radius:6px;margin:16px 0;">
                    <tr th:if="${ipresNombre != null}">
                        <td style="padding:8px 16px;font-weight:bold;">IPRESS</td>
                        <td style="padding:8px 16px;" th:text="${ipresNombre}">—</td>
                    </tr>
                    <tr th:if="${redNombre != null}">
                        <td style="padding:8px 16px;font-weight:bold;">Red</td>
                        <td style="padding:8px 16px;" th:text="${redNombre}">—</td>
                    </tr>
                </table>
                <p style="text-align:center;margin:28px 0;">
                    <a th:href="${appUrl} + '/usuarios/solicitudes'"
                       style="background:#00579e;color:#fff;text-decoration:none;padding:12px 28px;border-radius:6px;font-size:15px;display:inline-block;">
                        Revisar solicitud
                    </a>
                </p>
                <p style="color:#888;font-size:13px;margin-top:32px;">Este correo fue generado automáticamente. No respondas a este mensaje.</p>
            </td>
        </tr>
    </table>
</body>
</html>
